<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キョウクラエディタ</title>
<style>
  :root {
    --bg:#12151c; --panel:#1a1f2a; --chip:#232936; --line:#2f3747;
    --text:#e8ecf4; --dim:#9aa4b8; --accent:#006888; --gold:#FFC53D;
    --bad:#ff6b6b;
  }
  * { box-sizing:border-box; font-family:"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; }
  body { margin:0; background:var(--bg); color:var(--text); font-size:14px; }
  header { position:sticky; top:0; z-index:10; background:var(--panel);
           border-bottom:1px solid var(--line); padding:10px 14px;
           display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 10px 0 0; }
  button { border:1px solid var(--line); background:var(--panel); color:var(--text);
           border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { border-color:#5a2a2a; color:#ffb3b3; }
  button.small { padding:3px 8px; font-size:12px; }
  input, select { border:1px solid var(--line); background:var(--chip);
           color:var(--text); border-radius:6px; padding:5px 8px; font-size:13px; }
  input[type=number] { width:88px; }
  main { padding:14px; max-width:1180px; margin:0 auto; }
  .cols { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:12px 14px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  label { color:var(--dim); font-size:12px; min-width:96px; }
  .note { background:var(--chip); border-radius:6px; padding:10px 12px;
          margin-bottom:12px; color:var(--dim); font-size:12.5px; line-height:1.9; }
  .note b { color:var(--text); }
  .list { min-width:240px; }
  .list button { display:block; width:100%; text-align:left; margin-bottom:4px; }
  .hint { color:var(--dim); font-size:12px; margin:4px 0 0; line-height:1.7; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; }
  code { background:var(--chip); border-radius:4px; padding:1px 6px; font-size:12px; }
  hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
</style>
</head>
<body>
<header>
  <h1>👹 キョウクラエディタ</h1>
  <button id="t-boss" class="on" onclick="setTab('boss')">ボス</button>
  <button id="t-area" onclick="setTab('area')">出る範囲</button>
  <span style="flex:1"></span>
  <button onclick="document.getElementById('load').click()">読み込む</button>
  <input type="file" id="load" accept=".json" style="display:none" onchange="loadFile(event)">
  <button class="primary" onclick="save()">書き出す</button>
</header>

<main>
  <div class="note" id="topNote"></div>
  <div class="cols">
    <div class="card list">
      <h3 id="listTitle">ボスの一覧</h3>
      <div id="list"></div>
      <hr>
      <button class="small" onclick="addOne()">＋ 足す</button>
      <button class="small danger" onclick="delOne()">選んでいるものを消す</button>
    </div>
    <div style="flex:1; min-width:420px">
      <div id="form"></div>
    </div>
  </div>
</main>

<datalist id="mobs"></datalist>
<datalist id="worlds"></datalist>

<script>
// ══════════════════════════════════════════════════════════════
//  キョウクラエディタ
//
//  🔴 ボスの性能・ごほうび・出る範囲を、コマンドを覚えずに書く道具。
//  ⚠️ 運営だけが使う。参加者には配らない。
//
//  🔴 出す先は config/kyotekicraft/ の boss.json と boss-areas.json。
//     ⚠️ ファイル名は変えない。名前で読み分けている。
//
//  🔴 上書きになる。⚠️ いま入っているものを先に読み込んでから直す。
// ══════════════════════════════════════════════════════════════

/** ボスバーの色。⚠️ ここに無い名前を書くと赤になる。 */
var BAR_COLORS = [
  ["red", "赤"], ["blue", "青"], ["green", "緑"],
  ["yellow", "黄"], ["purple", "紫"], ["pink", "桃"], ["white", "白"]
];

/** よく使う元の敵。⚠️ ここに無いものも手で書ける。 */
var MOBS = [
  "minecraft:zombie", "minecraft:skeleton", "minecraft:spider",
  "minecraft:creeper", "minecraft:enderman", "minecraft:witch",
  "minecraft:pillager", "minecraft:vindicator", "minecraft:evoker",
  "minecraft:ravager", "minecraft:piglin_brute", "minecraft:wither_skeleton",
  "minecraft:blaze", "minecraft:hoglin", "minecraft:warden",
  "minecraft:iron_golem", "minecraft:husk", "minecraft:drowned",
  "minecraft:stray", "minecraft:zombified_piglin", "minecraft:slime",
  "minecraft:magma_cube", "minecraft:phantom", "minecraft:vex"
];

/** ⚠️ すけクラの世界。独自のものも名前空間は minecraft:。 */
var WORLDS = [
  "minecraft:overworld", "minecraft:survival_dim_a", "minecraft:survival_dim_b",
  "minecraft:the_nether", "minecraft:the_end", "minecraft:event_dim"
];

var tab = "boss";
var bosses = [];
var areas = [];
var picked = 0;

function el(id) { return document.getElementById(id); }

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
}

/** いま編集している一覧。 */
function rows() { return tab === "boss" ? bosses : areas; }
function cur() { return rows()[picked]; }

function setTab(t) {
  tab = t;
  picked = 0;
  el("t-boss").classList.toggle("on", t === "boss");
  el("t-area").classList.toggle("on", t === "area");
  el("listTitle").textContent = (t === "boss") ? "ボスの一覧" : "出る範囲の一覧";
  render();
}

// ── 新しい1件 ───────────────────────────────────────────────

function blankBoss() {
  return {
    id: "new_boss", name: "新しいボス", mob: "minecraft:zombie",
    scale: 2.0, healthTimes: 3.0, damageTimes: 1.5, speedTimes: 1.5,
    knockback: 1.5, barColor: "red", bar: true, barRange: 32,
    music: "", musicSeconds: 0, minutes: 30,
    gear: { head: "", chest: "", legs: "", feet: "", hand: "", offhand: "", dropChance: 0 },
    sendBack: true, reward: [], rewardCommands: []
  };
}

function blankArea() {
  return {
    name: "new_area", world: "minecraft:survival_dim_a",
    x: 0, y: 64, z: 0, range: 24,
    boss: bosses.length ? bosses[0].id : "", coolMinutes: 60, lastAt: 0
  };
}

function addOne() {
  rows().push(tab === "boss" ? blankBoss() : blankArea());
  picked = rows().length - 1;
  render();
}

function delOne() {
  if (!rows().length) { return; }
  var what = (tab === "boss") ? cur().id : cur().name;
  if (!confirm("「" + what + "」を消します。よろしいですか。")) { return; }
  rows().splice(picked, 1);
  picked = Math.max(0, picked - 1);
  render();
}

// ── 画面 ────────────────────────────────────────────────────

function render() {
  el("topNote").innerHTML = (tab === "boss")
    ? "🔴 <b>ここで作るのはボスの性能とごほうびです。</b>"
      + "<br>⚠️ <b>「居座る分数」を 0 にすると、倒しそこねたボスが世界に残り続けます。</b>"
      + "歩いていて出会う出し方では、逃げられたぶんがそのまま溜まります。"
      + "<br>✅ <b>書き出したら <code>boss.json</code> をサーバーの "
      + "<code>config/kyotekicraft/</code> へ置いて再起動してください。</b>"
    : "🔴 <b>座標が分かっているときだけ、ここで書きます。</b>"
      + "<br>✅ <b>分からないときは、その場所に立ってコマンドを打つほうが確実です。</b>"
      + "<br><code>/kyoteki area add &lt;範囲の名前&gt; &lt;ボスのID&gt; [半径]</code>"
      + "<br>⚠️ <b>コマンドで足したものも <code>boss-areas.json</code> に入ります。</b>"
      + "読み込めばここで直せます。";

  var list = el("list");
  list.innerHTML = "";
  rows().forEach(function (one, i) {
    var b = document.createElement("button");
    b.className = (i === picked) ? "on" : "";
    b.textContent = label(one);
    b.onclick = function () { picked = i; render(); };
    list.appendChild(b);
  });
  if (!rows().length) {
    list.innerHTML = "<p class='hint'>まだ1つもありません。「＋ 足す」から作ってください。</p>";
  }
  el("form").innerHTML = rows().length
      ? ((tab === "boss") ? bossForm(cur()) : areaForm(cur()))
      : "";
}

function label(one) {
  return (tab === "boss")
      ? (one.name || "(名前なし)") + "　" + (one.id || "")
      : (one.name || "(名前なし)") + "　→ " + (one.boss || "?");
}

/**
 * 一覧の見出しだけ書き直す。
 *
 * ⚠️ <b>入力の途中で画面ごと作り直さない。</b> 作り直すと
 * <b>打っている欄から選択が外れて、1文字ずつしか打てなくなる</b>。
 */
function touch() {
  var list = el("list").children;
  rows().forEach(function (one, i) {
    if (list[i]) { list[i].textContent = label(one); }
  });
}

function setStr(k, v) { cur()[k] = v; touch(); }
function setNum(k, v) { cur()[k] = Number(v); touch(); }
function setRaw(k, v) { cur()[k] = v; touch(); }
function setGear(k, v) { cur().gear[k] = (k === "dropChance") ? Number(v) : v; }
function setArena(k, v) { cur().arena[k] = (k === "world") ? v : Number(v); }
function setReward(i, k, v) { cur().reward[i][k] = (k === "count") ? Number(v) : v; }
function setCommand(i, v) { cur().rewardCommands[i] = v; }

function num(labelText, key, step, hint) {
  return '<div class="row"><label>' + labelText + '</label>'
       + '<input type="number" step="' + step + '" value="' + esc(cur()[key]) + '"'
       + ' oninput="setNum(\'' + key + '\', this.value)">'
       + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div>';
}

function txt(labelText, key, hint, listId) {
  return '<div class="row"><label>' + labelText + '</label>'
       + '<input style="min-width:230px" value="' + esc(cur()[key]) + '"'
       + (listId ? ' list="' + listId + '"' : '')
       + ' oninput="setStr(\'' + key + '\', this.value)">'
       + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div>';
}

function chk(labelText, key, hint) {
  return '<div class="row"><label>' + labelText + '</label>'
       + '<input type="checkbox"' + (cur()[key] ? " checked" : "") + ''
       + ' onchange="setRaw(\'' + key + '\', this.checked)">'
       + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div>';
}

function bossForm(b) {
  if (!b.gear) {
    b.gear = { head: "", chest: "", legs: "", feet: "", hand: "", offhand: "", dropChance: 0 };
  }
  if (!b.reward) { b.reward = []; }
  if (!b.rewardCommands) { b.rewardCommands = []; }

  var h = '<div class="card"><h3>基本</h3>'
    + txt("ID", "id", "半角の英数字と _。🔴 一度決めたら変えない（範囲がこの名前で指している）")
    + txt("表示する名前", "name", "ボスバーと画面に出る")
    + txt("元になる敵", "mob", "この敵を大きく強くする", "mobs")
    + num("大きさ", "scale", "0.1", "⚠️ 2.0 なら天井が4マス要る")
    + '</div>';

  h += '<div class="card"><h3>強さ</h3>'
    + num("体力", "healthTimes", "0.1", "何倍にするか")
    + num("攻撃力", "damageTimes", "0.1", "何倍にするか")
    + num("速さ", "speedTimes", "0.1", "⚠️ 上げすぎると逃げられない")
    + num("ふっとばし", "knockback", "0.1", "")
    + '</div>';

  h += '<div class="card"><h3>ボスバー</h3>'
    + chk("バーを出す", "bar",
          "🔴 切ると残り体力が誰にも見えない。ただの強い敵に見せたいときだけ")
    + '<div class="row"><label>色</label>'
    + '<select onchange="setStr(\'barColor\', this.value)">'
    + BAR_COLORS.map(function (c) {
        return '<option value="' + c[0] + '"'
             + ((b.barColor === c[0]) ? " selected" : "") + '>' + c[1] + '</option>';
      }).join("")
    + '</select></div>'
    + num("見える半径", "barRange", "1",
          "🔴 ボスからの距離。⚠️ 0 にすると世界じゅう（別の世界にいる人にも見える）")
    + '</div>';

  h += '<div class="card"><h3>居座る長さと音</h3>'
    + num("居座る分数", "minutes", "1",
          "🔴 0 にしない。倒しそこねたぶんが世界に残り続ける")
    + txt("流す音", "music", "空なら流さない。例 minecraft:music_disc.pigstep")
    + num("音の長さ（秒）", "musicSeconds", "1", "0 なら鳴らしっぱなしにしない")
    + chk("倒したら元の場所へ戻す", "sendBack", "祭壇から呼んだときの帰り先")
    + '</div>';

  var slots = [["head", "頭"], ["chest", "胴"], ["legs", "脚"],
               ["feet", "足"], ["hand", "右手"], ["offhand", "左手"]];
  h += '<div class="card"><h3>着せるもの</h3><div class="grid">'
    + slots.map(function (p) {
        return '<div class="row"><label>' + p[1] + '</label>'
             + '<input style="min-width:150px" value="' + esc(b.gear[p[0]]) + '"'
             + ' oninput="setGear(\'' + p[0] + '\', this.value)"></div>';
      }).join("")
    + '</div>'
    + '<div class="row"><label>落とす確率</label>'
    + '<input type="number" step="0.05" min="0" max="1" value="' + esc(b.gear.dropChance) + '"'
    + ' oninput="setGear(\'dropChance\', this.value)">'
    + '<span class="hint">0 なら落とさない。1 で必ず落とす</span></div>'
    + '<p class="hint">⚠️ <b>空欄なら素のまま。</b>'
    + 'オリジナルの装備も書ける（例 <code>sukecra:armor_3</code>）</p>'
    + '</div>';

  h += '<div class="card"><h3>ごほうび</h3>'
    + '<p class="hint">⚠️ <b>戦った人ぜんぶに配ります。</b>1人ぶんの数を書いてください。</p>'
    + b.reward.map(function (r, i) {
        return '<div class="row">'
             + '<input style="min-width:210px" value="' + esc(r.item) + '"'
             + ' oninput="setReward(' + i + ', \'item\', this.value)">'
             + '<input type="number" min="1" value="' + esc(r.count) + '"'
             + ' oninput="setReward(' + i + ', \'count\', this.value)">'
             + '<button class="small danger" onclick="dropReward(' + i + ')">消す</button>'
             + '</div>';
      }).join("")
    + '<button class="small" onclick="addReward()">＋ 品物を足す</button>'
    + '<hr>'
    + '<p class="hint">🔴 <b>称号はコマンドで渡します。</b>'
    + '<code>%s</code> が倒した人の名前に変わります。</p>'
    + b.rewardCommands.map(function (c, i) {
        return '<div class="row">'
             + '<input style="min-width:340px" value="' + esc(c) + '"'
             + ' oninput="setCommand(' + i + ', this.value)">'
             + '<button class="small danger" onclick="dropCommand(' + i + ')">消す</button>'
             + '</div>';
      }).join("")
    + '<button class="small" onclick="addCommand()">＋ コマンドを足す</button>'
    + '</div>';

  return h + arenaCard(b);
}

function addReward() { cur().reward.push({ item: "minecraft:diamond", count: 1 }); render(); }
function dropReward(i) { cur().reward.splice(i, 1); render(); }
function addCommand() { cur().rewardCommands.push("name title give %s "); render(); }
function dropCommand(i) { cur().rewardCommands.splice(i, 1); render(); }

function arenaCard(b) {
  var on = !!b.arena;
  var h = '<div class="card"><h3>闘技場（祭壇で呼んだとき）</h3>'
    + '<div class="row"><label>飛ばす</label>'
    + '<input type="checkbox"' + (on ? " checked" : "") + ''
    + ' onchange="toggleArena(this.checked)">'
    + '<span class="hint">⚠️ 切ると<b>祭壇のその場</b>に出る</span></div>';
  if (on) {
    var a = b.arena;
    h += '<div class="row"><label>世界</label>'
      + '<input style="min-width:230px" list="worlds" value="' + esc(a.world) + '"'
      + ' oninput="setArena(\'world\', this.value)"></div>'
      + '<div class="row"><label>人の行き先</label>'
      + ["x", "y", "z"].map(function (k) {
          return '<input type="number" step="1" value="' + esc(a[k]) + '"'
               + ' oninput="setArena(\'' + k + '\', this.value)">';
        }).join("")
      + '</div>'
      + '<p class="hint">🔴 <b>全部 0 のままだと使われません</b>'
      + '（書き忘れて世界の原点へ飛ばされるのを防ぐため）。</p>'
      + '<div class="row"><label>ボスの出る場所</label>'
      + '<input type="checkbox"' + (sameSpot(a) ? " checked" : "")
      + ' onchange="toggleBossSpot(this.checked)">'
      + '<span class="hint">人と同じところに出す</span></div>'
      + (sameSpot(a) ? ''
         : '<div class="row"><label></label>'
           + ["bossX", "bossY", "bossZ"].map(function (k) {
               return '<input type="number" step="1" value="' + esc(a[k]) + '"'
                    + ' oninput="setBossSpot(\'' + k + '\', this.value)">';
             }).join("")
           + '<span class="hint">⚠️ 世界は上と同じ</span></div>')
      + '<p class="hint">⚠️ <b>ボスだけ別の世界には置けません。</b>'
      + '離れていると戦いになりません。</p>';
  }
  return h + '</div>';
}

/** ボスを人と同じところに出すか。⚠️ 1つでも空なら「同じ」。 */
function sameSpot(a) {
  return a.bossX === null || a.bossY === null || a.bossZ === null
      || a.bossX === undefined || a.bossY === undefined || a.bossZ === undefined;
}

/**
 * ボスの出る場所を、人と同じにするか分けるか。
 *
 * 🔴 <b>分けたいのは、人が安全な場所に降りてから戦いを始めたいとき</b>。
 * ⚠️ <b>同じ場所に出すと、飛んだ瞬間にボスと重なる。</b>
 */
function toggleBossSpot(same) {
  var a = cur().arena;
  if (same) {
    a.bossX = null; a.bossY = null; a.bossZ = null;
  } else {
    // ⚠️ 人の行き先を種にする。0 から始めると原点を指してしまう
    a.bossX = Math.round(a.x); a.bossY = Math.round(a.y); a.bossZ = Math.round(a.z);
  }
  render();
}

function setBossSpot(k, v) { cur().arena[k] = Math.round(Number(v)); }

function toggleArena(on) {
  cur().arena = on
      ? { world: "minecraft:event_dim", x: 0, y: 64, z: 0,
          bossX: null, bossY: null, bossZ: null }
      : null;
  render();
}

function areaForm(a) {
  return '<div class="card"><h3>出る範囲</h3>'
    + txt("範囲の名前", "name", "半角の英数字と _。⚠️ 消すときに使う")
    + '<div class="row"><label>ボス</label>'
    + '<select onchange="setStr(\'boss\', this.value)">'
    + (bosses.length
        ? bosses.map(function (b) {
            return '<option value="' + esc(b.id) + '"'
                 + ((a.boss === b.id) ? " selected" : "") + '>'
                 + esc(b.name) + '（' + esc(b.id) + '）</option>';
          }).join("")
        : '<option value="">（先に boss.json を読み込んでください）</option>')
    + '</select></div>'
    + txt("世界", "world", "", "worlds")
    + '<div class="row"><label>座標</label>'
    + ["x", "y", "z"].map(function (k) {
        return '<input type="number" step="1" value="' + esc(a[k]) + '"'
             + ' oninput="setNum(\'' + k + '\', this.value)">';
      }).join("")
    + '<span class="hint">⚠️ F3 で見た数字をそのまま</span></div>'
    + num("半径", "range", "1", "4〜256。この円の中に入ると出る")
    + num("次に出るまで（分）", "coolMinutes", "1", "⚠️ 短いと湧き放題になる")
    + '<p class="hint">✅ <b>座標が分からないときは、その場所に立って</b><br>'
    + '<code>/kyoteki area add ' + esc(a.name || "名前") + ' '
    + esc(a.boss || "ボスID") + ' ' + esc(a.range) + '</code><br>'
    + '<b>と打つほうが確実です。</b></p>'
    + '</div>';
}

// ── 読み書き ────────────────────────────────────────────────

/**
 * 読み込む。
 *
 * 🔴 <b>中身で見分ける。</b> ⚠️ ファイル名は当てにしない――
 * 手元で名前を変えられていることがある。
 */
function loadFile(ev) {
  var f = ev.target.files[0];
  if (!f) { return; }
  var r = new FileReader();
  r.onload = function () {
    var d;
    try { d = JSON.parse(r.result); }
    catch (e) { alert("読めませんでした：" + e.message); return; }
    if (!Array.isArray(d)) { alert("一覧の形（[ ... ]）ではありません。"); return; }
    var looksArea = d.length && (("range" in d[0]) || ("coolMinutes" in d[0]));
    if (looksArea) { areas = d; setTab("area"); }
    else { bosses = d; setTab("boss"); }
    alert((looksArea ? "出る範囲" : "ボス") + " を " + d.length + " 件 読み込みました。");
  };
  r.readAsText(f, "utf-8");
  ev.target.value = "";
}

function save() {
  var bad = check();
  if (bad.length) {
    alert("このままでは書き出せません。\n\n" + bad.join("\n"));
    return;
  }
  var name = (tab === "boss") ? "boss.json" : "boss-areas.json";
  var a = document.createElement("a");
  a.href = URL.createObjectURL(
      new Blob([JSON.stringify(rows(), null, 2)], { type: "application/json" }));
  a.download = name;
  a.click();
  setTimeout(function () {
    alert(name + " を保存しました。\n\n"
      + "【やること】\n"
      + "  1. サーバーの config/kyotekicraft/ へ置く\n"
      + "  2. サーバーを再起動する\n\n"
      + "⚠️ ファイル名は変えないでください。名前で読み分けています。\n"
      + "🔴 上書きになります。いま入っているものを先に読み込んでから直してください。");
  }, 300);
}

/**
 * 出す前に見る。
 *
 * 🔴 <b>通してから直すと、サーバーが起動しないことがある。</b>
 * ⚠️ ここで止めるほうが安い。
 */
function check() {
  var bad = [];
  var seen = {};
  if (tab === "boss") {
    bosses.forEach(function (b) {
      if (!/^[a-z0-9_]+$/.test(b.id || "")) {
        bad.push("・ID「" + b.id + "」は半角の英数字と _ だけにしてください");
      }
      if (seen[b.id]) { bad.push("・ID「" + b.id + "」が2つあります"); }
      seen[b.id] = 1;
      if (!b.name) { bad.push("・「" + b.id + "」に表示する名前がありません"); }
      if (!b.mob) { bad.push("・「" + b.id + "」に元になる敵がありません"); }
      if (Number(b.minutes) === 0) {
        bad.push("・🔴「" + b.id + "」の居座る分数が 0 です。"
               + "倒しそこねたぶんが世界に残り続けます");
      }
    });
  } else {
    areas.forEach(function (a) {
      if (!/^[A-Za-z0-9_]+$/.test(a.name || "")) {
        bad.push("・範囲の名前「" + a.name + "」は半角の英数字と _ だけにしてください");
      }
      if (seen[a.name]) { bad.push("・範囲の名前「" + a.name + "」が2つあります"); }
      seen[a.name] = 1;
      if (!a.boss) { bad.push("・範囲「" + a.name + "」にボスが決まっていません"); }
      if (bosses.length && !bosses.some(function (b) { return b.id === a.boss; })) {
        bad.push("・範囲「" + a.name + "」のボス「" + a.boss + "」は一覧にいません");
      }
      if (Number(a.range) < 4 || Number(a.range) > 256) {
        bad.push("・範囲「" + a.name + "」の半径は 4〜256 にしてください");
      }
    });
  }
  return bad;
}

// 入力の候補
el("mobs").innerHTML = MOBS.map(function (m) {
  return '<option value="' + m + '">';
}).join("");
el("worlds").innerHTML = WORLDS.map(function (w) {
  return '<option value="' + w + '">';
}).join("");

render();
