  /* ⚠️ これが無いと、余白のぶんだけ横にはみ出して横スクロールが出る */

  a:hover { text-decoration: underline; }

<body>
  <h1>すけクラの道具</h1>
  <ul>
    <li><a href="shigokura/">シゴクラエディタ</a><span>料理・建材・家具・中間素材の絵を描く</span></li>
    <li><a href="asobicraft/">アソクラエディタ</a><span>ミニゲームのシナリオを組み立てる</span></li>
  </ul>
  <p class="note">⚠️ ここで作ったものは、誰でも見られる場所に置かれます。
